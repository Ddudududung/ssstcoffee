<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#f5f5f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sticker 1: Square with rounded corners -->
  <rect x="25" y="28" width="42" height="42" rx="10" fill="#1d1d1f"/>
  <circle cx="38" cy="46" r="2.5" fill="#f5f5f7" stroke="none"/>
  <circle cx="54" cy="46" r="2.5" fill="#f5f5f7" stroke="none"/>
  <path d="M42 54 Q46 58 50 54" stroke="#f5f5f7" stroke-width="2" fill="none"/>

  <!-- Sticker 2: Circle sticker overlapping -->
  <circle cx="72" cy="74" r="24" fill="#1d1d1f"/>
  <!-- Doodle face on circle -->
  <circle cx="65" cy="70" r="2" fill="#f5f5f7" stroke="none"/>
  <circle cx="79" cy="70" r="2" fill="#f5f5f7" stroke="none"/>
  <path d="M68 79 Q72 83 76 79" stroke="#f5f5f7" stroke-width="2" fill="none"/>
  <!-- Coffee bean sparkle -->
  <ellipse cx="88" cy="35" rx="3" ry="5" transform="rotate(30 88 35)" fill="#48484a" stroke="#f5f5f7" stroke-width="1.5"/>
</svg>

