<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#f5f5f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Lighter metal hood / spark wheel -->
  <rect x="50" y="24" width="20" height="16" rx="2" fill="#1d1d1f"/>
  <line x1="56" y1="28" x2="56" y2="36" stroke="#737375" stroke-width="1.5"/>
  <line x1="64" y1="28" x2="64" y2="36" stroke="#737375" stroke-width="1.5"/>
  <!-- Spark wheel -->
  <circle cx="68" cy="27" r="4" stroke="#f5f5f7" stroke-width="1.5" fill="#48484a"/>
  <!-- Lighter Body -->
  <rect x="46" y="40" width="28" height="60" rx="5" fill="#1d1d1f"/>
  <!-- Doodle horizontal lines / grip -->
  <line x1="52" y1="52" x2="68" y2="52" stroke="#f5f5f7" stroke-width="2"/>
  <line x1="52" y1="60" x2="68" y2="60" stroke="#f5f5f7" stroke-width="2"/>
  <line x1="52" y1="68" x2="68" y2="68" stroke="#f5f5f7" stroke-width="2"/>
  <line x1="52" y1="76" x2="68" y2="76" stroke="#f5f5f7" stroke-width="2"/>
</svg>

